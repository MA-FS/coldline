name: CI

# Third-party actions are pinned to reviewed commit SHAs (the tag is kept in a comment for readers), and
# dependencies install only from the committed uv.lock: --locked fails the job if the lock is out of date.
# The deploy job holds the Fly credential, so nothing it runs may come from a moving reference.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.5.31" # same uv as the image
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  # Known advisories (OSV / PyPI) for every locked runtime dependency, by exact version and hash. A signal,
  # not a deploy gate: a new advisory turns this job red without blocking an unrelated fix from shipping.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.5.31"
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
      - run: uvx --from pip-audit==2.9.0 pip-audit --disable-pip --progress-spinner off -r requirements.txt

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # flyctl receives the deploy credential, so it is a reviewed release checked against its published
      # SHA-256 (from flyctl_<version>_checksums.txt), never "latest". To update: pick a release, compare its
      # checksum file with the downloaded archive, then change both values together.
      - name: Install flyctl (pinned, checksum verified)
        env:
          FLYCTL_VERSION: "0.5.5"
          FLYCTL_SHA256: 2c64e1c7f320fafed0452fbce9adff57fcaf733619f0faa315ae883ec03d7ef6
        run: |
          curl -fsSL -o flyctl.tgz "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "${FLYCTL_SHA256}  flyctl.tgz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/flyctl" && tar -xzf flyctl.tgz -C "$RUNNER_TEMP/flyctl" flyctl && rm flyctl.tgz
          echo "$RUNNER_TEMP/flyctl" >> "$GITHUB_PATH"
      - run: flyctl version && flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
